services:
  limo:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # UID/GID do host, para os arquivos do bind mount nascerem com o dono
        # certo e para o Xwayland autorizar o container (SI:localuser)
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    image: ${IMAGE_NAME:-limo-humble:latest}
    container_name: ${CONTAINER_NAME:-limo_dev}

    # host: mesmo stack DDS do host, sem NAT. O isolamento em relação a outros
    # containers ROS na máquina vem exclusivamente do ROS_DOMAIN_ID.
    network_mode: host
    ipc: host

    volumes:
      - ./ws:/home/limo/ws
      - /tmp/.X11-unix:/tmp/.X11-unix
      # XAUTH_FILE é resolvido pelo setup.sh: em GNOME/Wayland o arquivo de
      # autoridade não é ~/.Xauthority, e sim o .mutter-Xwaylandauth em /run
      - ${XAUTH_FILE:-${HOME}/.Xauthority}:/home/limo/.Xauthority

    environment:
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: "1"
      XAUTHORITY: /home/limo/.Xauthority
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}

    # aceleração gráfica via Mesa (GPU integrada)
    devices:
      - /dev/dri:/dev/dri

    # GIDs de video e render DO HOST: o container roda como usuário comum e
    # precisa pertencer a esses grupos para abrir /dev/dri/*.
    # Os números variam entre distribuições -- o setup.sh os lê da máquina.
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-992}"

    stdin_open: true
    tty: true
    command: bash
